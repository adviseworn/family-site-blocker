# Family Site Blocker's pipelines on GitLab, in place of the GitHub Actions workflows it had until 1.24.0.
#
# On every push to a branch, on a Linux machine:
#   checks    the fast checks (npm test), then the Firefox zip (npm run package:firefox) checked with Mozilla's
#             add-on linter, the same check addons.mozilla.org runs before it publishes a version.
#   browsers  the extension in Chromium (npm run test:browser) and in Firefox (npm run test:firefox, with
#             Mozilla's own Firefox build). The image is Playwright's, which holds the Chromium that the
#             playwright version in package.json expects, and Firefox's libraries: when package.json's
#             playwright changes, change the image's tag to match. It runs only for a branch that changes
#             something the suites load or run (the add-on, the tests, the scripts, the lists, package.json
#             or this file, compared with main): a branch that changes only the Android app or the guide
#             skips it, and its pipeline is the checks job alone, under 2 minutes in place of 7.
# They don't run again for a push to main: merges are fast-forward and need a passed pipeline, so the commit
# that lands on main is the very one that passed them on its branch. (GitLab's free plan gives 400 pipeline
# minutes a month; the second run took a fifth of November 2026's, which were all but gone by the 9th.) A
# pipeline started by hand on main still runs them: start one for a commit pushed straight to main, with no
# merge request, which nothing has tested.
# When a version lands on main (a push that changes extension/manifest.json):
#   sign          gets the version published on addons.mozilla.org and signed, checks the signed file, and
#                 publishes the release: the signed .xpi, the zip that gives it the add-on's icon on a Mac and
#                 the Firefox lock's profile go in the project's package registry, and the release links to them.
#                 If Mozilla already has the version, it downloads that signed file instead of uploading again.
#                 Mozilla publishes a version once its automatic check passes, but holds some for a reviewer,
#                 the first public version among them, which can take days. The job waits for the approval
#                 only a little: 5 minutes (the CI/CD variable APPROVAL_WAIT_MINUTES changes that, in whole
#                 minutes), and not at all while the add-on has no public version on Mozilla's site yet. Until
#                 1.29.0 it waited 25 minutes for every version, which took 158 of November 2026's 400 free
#                 pipeline minutes. A version still held then stays at Mozilla, uploaded: once Mozilla's email
#                 says it is approved, a pipeline started by hand (Build → Pipelines → New pipeline, on main,
#                 with the variable SIGN set to yes, and PUBLISH set to yes too to publish the update files in
#                 the same pipeline) downloads the signed file and finishes the job.
#   update-files  builds the update manifest and the newest signed .xpi files from the project's releases and
#                 publishes them on the project's GitLab Pages site (scripts/updates-site.mjs says where), which
#                 the Firefox lock installs from and copies from before 1.24.0 update from, with the guide (the
#                 README rendered, scripts/guide.mjs) as the site's front page and the lock's profile beside it.
#                 The project is private; the site is what the public sees (Pages access set to Everyone). A
#                 pipeline started by hand with PUBLISH set to yes publishes them again.
# Started by hand, from a pipeline on main (the play button next to the job) or a pipeline started by hand
# (Build → Pipelines → New pipeline, or through the pipelines API: the source web or api, treated alike):
#   lock-check      tests the Firefox lock with the newest signed release, on Linux, where Firefox reads the
#                   same policies from a policies.json next to the program (test/firefox-lock.e2e.mjs). It
#                   fetches version 1.1.1 from Mozilla with the API key the sign job uses, and LeechBlock NG, a
#                   site blocker from addons.mozilla.org, as another blocker's add-on.
#   pictures-check  judges the real pictures listed in test/real-pictures.txt (npm run check:pictures), and any
#                   in the variable PICTURE_URLS, separated by spaces.
#   mozilla-backup  saves every version Mozilla has signed, 1.1.1 on, in the project's package registry next to
#                   the release files (scripts/amo-backup.mjs), so the project keeps its own copies. A pipeline
#                   started by hand with BACKUP set to yes runs it at once.
#   android         builds the Android browser, the app in android/ with the add-on built in: the APK for the phone
#                   and the bundle for Google Play (android/ci/android-job.yml, included below, which also says where
#                   the signing key lives). Gecko makes it a long job, so it runs only by hand: the play button next
#                   to the android job on a pipeline's page, or a pipeline started by hand with ANDROID set to yes.
#
# The sign, mozilla-backup and lock-check jobs need two CI/CD variables (Settings → CI/CD → Variables, masked), the two parts of an API key
# from https://addons.mozilla.org/developers/addon/api/key/ : AMO_JWT_ISSUER (the "JWT issuer") and
# AMO_JWT_SECRET (the "JWT secret"). Nothing else needs setting up: the release, the package registry and
# GitLab Pages all take the job's own token.
#
# GitLab's free plan has no Macs, so the Mac test run, the installer package that closes Firefox's Option key
# (scripts/mac-installer.mjs, which needs Apple's pkgbuild) and the Mac-only checks run only on a Mac by hand.

stages: [test, sign, publish]

include:
  - local: android/ci/android-job.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never # the release makes a tag; nothing runs for it
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never # the branch's own pipeline is the merge request's
    - if: $CI_COMMIT_BRANCH

variables:
  npm_config_fund: 'false'
  npm_config_audit: 'false'
  npm_config_update_notifier: 'false'

.node:
  image: node:22
  cache:
    key:
      files: [package.json]
    paths: [node_modules/]
  before_script:
    - command -v zip > /dev/null || (apt-get update -qq && apt-get install -y -qq zip > /dev/null)
    - node --version
    - npm install

# The two test jobs stop when a newer push to the same branch starts its own pipeline, and stay out of a
# pipeline started by hand just to sign or publish, and out of the pipeline of a push to main, whose commit
# passed them on its branch before the merge (see the top of this file).
.tests:
  extends: .node
  stage: test
  interruptible: true
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($SIGN == "yes" || $PUBLISH == "yes" || $BACKUP == "yes" || $ANDROID == "yes")
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: never # tested on its branch already
    - if: $CI_COMMIT_BRANCH

checks:
  extends: .tests
  script:
    - npm test 2>&1 | tee fast.tap || true
    # One fast check needs a Mac (the Finder icon on the .xpi) and is skipped here by design.
    - node scripts/ci-summary.mjs --allow-skips=1 fast=fast.tap
    - npm run package:firefox
    # Checked as a listed add-on: from 1.24.0 it is published on addons.mozilla.org, so its manifest carries
    # no update_url, which the linter would flag (until 1.23.0 the add-on was self-hosted, and the linter was
    # told so, with the linter's self-hosted switch, which allowed one).
    - npx --yes addons-linter dist/family-site-blocker-firefox.zip --output json --boring --max-manifest-version=3 > lint.json || true
    - node scripts/lint-firefox-report.mjs lint.json

browsers:
  extends: .tests
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  # Out of the same pipelines as the checks job (.tests' first two rules, repeated here: a job's rules replace
  # the ones it extends). Then: a pipeline started by hand runs the suites whatever changed, and a push runs
  # them only when its branch differs from main in a file the suites load or run. The Android app (android/)
  # and the guide (README.md) aren't among those; test/pipeline.test.mjs checks that every file and folder at
  # the top of the project is either listed here or known not to matter.
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($SIGN == "yes" || $PUBLISH == "yes" || $BACKUP == "yes" || $ANDROID == "yes")
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: never # tested on its branch already
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "push"
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: refs/heads/main
        paths:
          - extension/**/*
          - test/**/*
          - scripts/**/*
          - blocklists/**/*
          - mac/**/*
          - assets/**/*
          - package.json
          - .gitlab-ci.yml
  script:
    # Firefox for Linux comes as a .tar.xz; the job's image may have no xz to open it with (Playwright's hasn't).
    - command -v xz > /dev/null || (apt-get update -qq && apt-get install -y -qq xz-utils > /dev/null)
    - curl -fsSL --retry 3 -o firefox.tar "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
    - mkdir -p firefox && tar -xf firefox.tar -C firefox --strip-components=1
    - grep PRETTY_NAME /etc/os-release; node -e "import('playwright').then(async ({ chromium }) => { const b = await chromium.launch(); console.log('Chromium', b.version()); await b.close(); })"; firefox/firefox --version
    - npm run test:browser 2>&1 | tee chromium.tap || true
    - FIREFOX=$PWD/firefox/firefox npm run test:firefox 2>&1 | tee firefox.tap || true
    - node scripts/ci-summary.mjs chromium=chromium.tap firefox=firefox.tap

sign:
  extends: .node
  stage: sign
  interruptible: false
  resource_group: sign-with-mozilla # one signing at a time
  timeout: 45 minutes # room for a long APPROVAL_WAIT_MINUTES
  needs: [] # starts at once: the commit's tests passed on its branch, before the merge
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SIGN == "yes"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")
      when: never # a pipeline started by hand signs only when asked to (changes: is always true for one)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [extension/manifest.json] # every version bump changes it
  variables:
    WEB_EXT_API_KEY: $AMO_JWT_ISSUER
    WEB_EXT_API_SECRET: $AMO_JWT_SECRET
  script:
    - |
      if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
        echo "No API key: save AMO_JWT_ISSUER and AMO_JWT_SECRET under Settings → CI/CD → Variables. They come from https://addons.mozilla.org/developers/addon/api/key/"
        exit 1
      fi
    - npm run package:firefox
    - VERSION=$(node -p "require('./extension/manifest.json').version")
    - API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
    - PACKAGE_URL="$API/packages/generic/family-site-blocker/$VERSION"
    - |
      if curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" "$API/releases/v$VERSION" > /dev/null 2>&1; then
        if [ "$CI_PIPELINE_SOURCE" != web ] && [ "$CI_PIPELINE_SOURCE" != api ]; then
          # A push that touched manifest.json without raising the version, or a second run for the same one.
          echo "Version $VERSION is already signed and released; nothing to do."
          exit 0
        fi
        echo "Version $VERSION is already signed and released. Raise version in extension/manifest.json first."
        exit 1
      fi
    # How long to wait for Mozilla's approval, in minutes. Mozilla holds the first public version for a
    # reviewer, which takes days, so while the add-on's page isn't public (its address in Mozilla's API answers
    # only once a version is approved) the job doesn't wait at all; after that, APPROVAL_WAIT_MINUTES or 5.
    - |
      if curl -fs -o /dev/null "https://addons.mozilla.org/api/v5/addons/addon/family-site-blocker/"; then
        export AMO_WAIT_MINUTES="${APPROVAL_WAIT_MINUTES:-5}"
      else
        export AMO_WAIT_MINUTES=0
        echo "The add-on has no public version on addons.mozilla.org yet, so its versions wait for a reviewer."
      fi
      echo "Waiting up to $AMO_WAIT_MINUTES minutes for Mozilla's approval."
    # Mozilla won't take the same version twice. If it already has this one (uploaded by hand, or by a run
    # that stopped later on, or didn't wait for a reviewer), download its signed file; otherwise upload it
    # with the page's words (scripts/amo-metadata.mjs) and wait that long for Mozilla to approve and sign it.
    - |
      later="Mozilla's email says when it's approved: start a pipeline on main by hand then, with the variable SIGN set to yes (and PUBLISH set to yes too, to publish the update files in the same pipeline), and it downloads the signed file and publishes the release."
      found=0
      node scripts/amo-signed.mjs "$VERSION" web-ext-artifacts || found=$?
      if [ "$found" = 3 ]; then
        node scripts/amo-metadata.mjs "$VERSION" "$CI_COMMIT_SHA" "$CI_COMMIT_TITLE" > dist/amo-metadata.json
        npx --yes web-ext@10.7.0 sign --channel=listed --amo-metadata=dist/amo-metadata.json --source-dir=dist/firefox --artifacts-dir=web-ext-artifacts --approval-timeout=$((AMO_WAIT_MINUTES * 60000)) || {
          echo "Not signed yet: Mozilla hasn't approved and signed $VERSION in this run (see above). If the upload went through and the version is waiting for a reviewer, which the first public version does, $later"
          exit 1
        }
        # With no wait at all, web-ext stops once Mozilla's automatic check has passed, and leaves no file.
        if ! ls web-ext-artifacts/*.xpi > /dev/null 2>&1; then
          echo "Uploaded, not signed yet: $VERSION is at Mozilla, waiting for its approval. $later"
          exit 1
        fi
      elif [ "$found" = 4 ]; then
        echo "Not signed yet: Mozilla has $VERSION and hasn't approved it. $later"
        exit 1
      elif [ "$found" != 0 ]; then
        exit "$found"
      fi
    - signed=$(ls web-ext-artifacts/*.xpi)
    - node scripts/check-signed.mjs "$signed" dist/firefox
    - npm run package:signed -- "$signed"
    - cp "$signed" "dist/family-site-blocker-$VERSION.xpi"
    - echo "Signed:" "$(node scripts/check-signed.mjs "$signed" dist/firefox | sed 's/^[^:]*:\s*//')" "sha256 $(sha256sum "$signed" | cut -c1-16)…"
    # The release's files go in the project's package registry, where anyone can download them, and the
    # release (Deploy → Releases) is made on this commit with its tag and links to them.
    - |
      for file in "dist/family-site-blocker-$VERSION.xpi" "dist/family-site-blocker-$VERSION.zip" mac/family-site-blocker-firefox.mobileconfig; do
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$PACKAGE_URL/$(basename "$file")" > /dev/null
        echo "Uploaded $PACKAGE_URL/$(basename "$file")"
      done
    - |
      node scripts/release-json.mjs "$VERSION" "$CI_COMMIT_SHA" "$PACKAGE_URL" > release.json
      curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data @release.json "$API/releases" > /dev/null
      echo "Released $CI_PROJECT_URL/-/releases/v$VERSION"

update-files:
  extends: .node
  stage: publish
  interruptible: false
  needs:
    - job: sign
      optional: true # a pipeline started by hand with PUBLISH set to yes has no sign job
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $PUBLISH == "yes"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [extension/manifest.json]
  script:
    - node scripts/release-files.mjs xpis 5 # the newest five signed versions: Firefox only ever wants the newest
    - node scripts/updates-manifest.mjs xpis public
    - node scripts/guide.mjs README.md public mac/family-site-blocker-firefox.mobileconfig # the guide as the site's front page, and the lock's profile
  pages: true # publishes the public folder on the project's GitLab Pages site
  artifacts:
    paths: [public]

.by-hand:
  extends: .node
  stage: test
  needs: []
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($SIGN == "yes" || $PUBLISH == "yes" || $BACKUP == "yes" || $ANDROID == "yes")
      when: never
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

lock-check:
  extends: .by-hand
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  timeout: 30 minutes
  script:
    - node scripts/release-files.mjs signed 1
    - node scripts/amo-signed.mjs 1.1.1 older
    - mkdir -p other && curl -fsSL --retry 3 -o other/leechblock-ng.xpi https://addons.mozilla.org/firefox/downloads/latest/leechblock-ng/latest.xpi
    # Firefox for Linux comes as a .tar.xz; the job's image may have no xz to open it with (Playwright's hasn't).
    - command -v xz > /dev/null || (apt-get update -qq && apt-get install -y -qq xz-utils > /dev/null)
    - curl -fsSL --retry 3 -o firefox.tar "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
    - mkdir -p firefox && tar -xf firefox.tar -C firefox --strip-components=1
    - firefox/firefox --version; ls signed older other
    - SIGNED_XPI=$(ls signed/*.xpi) OLDER_XPI=$(ls older/*.xpi) OTHER_XPI=other/leechblock-ng.xpi FIREFOX=$PWD/firefox/firefox npm run test:firefox-lock 2>&1 | tee lock.tap || true
    - node scripts/ci-summary.mjs lock=lock.tap

mozilla-backup:
  extends: .node
  stage: test
  needs: []
  timeout: 30 minutes
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $BACKUP == "yes"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($SIGN == "yes" || $PUBLISH == "yes" || $ANDROID == "yes")
      when: never
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - node scripts/amo-backup.mjs backup 2>&1 | tee backup.txt
  artifacts:
    paths: [backup.txt]
    expire_in: 1 year

pictures-check:
  extends: .by-hand
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  timeout: 20 minutes
  script:
    - npm run check:pictures
