# Checks the Firefox lock on a GitHub-hosted Mac: puts the settings from
# mac/family-site-blocker-firefox.mobileconfig in force (as installing the profile would), installing the
# latest signed release from the test's stand-in internet in place of the update site, and runs
# test/firefox-lock.e2e.mjs. That includes Troubleshoot Mode, started with --safe-mode as the Option key
# does, where Firefox's own copy of the built-in list has to do the blocking because no add-on runs; the lock
# next to another blocker's policies, set in Firefox's own policies.json the way a program like Plucky can
# set them (with LeechBlock NG, a site blocker from addons.mozilla.org, as that blocker's add-on); the lock
# arriving after an older signed version (1.1.1, fetched from Mozilla with the API key the Sign with Mozilla
# workflow uses) was installed by hand and switched off; a new lock reaching a profile that has the older
# version; and the add-on updating itself from the update manifest.
# Start it from the Actions tab with "Run workflow", for example after a new release or a new Firefox.
name: Firefox lock check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Make sure Firefox is installed
        run: test -d /Applications/Firefox.app || brew install --cask firefox

      - name: Get the latest signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern 'family-site-blocker-*.xpi' --dir signed
          ls signed

      - name: Get an older signed version from Mozilla
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-signed.mjs 1.1.1 older

      - name: Get another blocker's add-on (LeechBlock NG) from addons.mozilla.org
        run: |
          mkdir other
          curl -fsSL --retry 3 -o other/leechblock-ng.xpi https://addons.mozilla.org/firefox/downloads/latest/leechblock-ng/latest.xpi
          ls -l other

      - name: Check the profile is a valid property list
        run: plutil -lint mac/family-site-blocker-firefox.mobileconfig

      - name: Firefox lock tests
        shell: bash
        run: |
          SIGNED_XPI=$(ls signed/*.xpi) OLDER_XPI=$(ls older/*.xpi) OTHER_XPI=other/leechblock-ng.xpi \
            npm run test:firefox-lock 2>&1 | tee lock.tap

      - name: Report what ran
        if: always()
        shell: bash
        run: |
          echo "::notice title=Machine::$(sw_vers -productName) $(sw_vers -productVersion) on $(uname -m); $(/Applications/Firefox.app/Contents/MacOS/firefox --version); $(ls signed)"
          count() { grep -E "^# $1 [0-9]+" lock.tap | tail -1 | awk '{print $3}'; }
          tests=$(count tests); pass=$(count pass); fail=$(count fail); skipped=$(count skipped)
          echo "::notice title=Firefox lock tests::$tests tests, $pass passed, $fail failed, $skipped skipped"
          grep -E "^\s+(not ok|ok) [0-9]+ - " lock.tap | sed 's/^ *//' | while read -r line; do echo "::notice title=lock::$line"; done
          if [ "${tests:-0}" = 0 ] || [ "${skipped:-1}" != 0 ] || [ "${fail:-1}" != 0 ]; then
            echo "::error title=Firefox lock tests::not every test ran and passed"; exit 1
          fi
