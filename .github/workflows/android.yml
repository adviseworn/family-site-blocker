# Builds the Android browser, the app in android/ with the add-on built in: the APK for the phone (arm64, the
# phone's chip) and the bundle for Google Play. Gecko makes it a long job, so it never runs on its own, not
# even for an engine bump: start it from the Actions tab with "Run workflow", on main, say, once an add-on
# version has landed and the phone should get it, since the add-on travels inside the app. Its files,
# family-site-blocker.apk and family-site-blocker.aab, are kept for a month as the run's
# "family-site-blocker-android" files.
#
# The release key lives in four repository secrets (Settings → Secrets and variables → Actions), entered there
# by the project's owner and nowhere else:
#   ANDROID_KEYSTORE_BASE64    the keystore file (.p12 or .jks) as base64 text, one line (base64 -i file | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the job still builds, signed with a debug key made for that run alone: such a build installs on
# a phone that doesn't have the app, but not over the app (Android takes a newer build only from the key that
# signed the older one), and Google Play won't take it. A key that has signed a build someone uses belongs in
# the four secrets.
name: Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # An SDK of the job's own, with exactly the platform and the build tools the app names, kept between runs.
      - name: Say where the Android SDK goes
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Keep the Android SDK and Gradle's downloads between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: android-sdk-and-gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', '.github/workflows/android.yml') }}
          restore-keys: android-sdk-and-gradle-

      - name: Get the Android SDK
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Build the APK and the bundle
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/release-keystore"
            signing=("-PfsbKeystore=$RUNNER_TEMP/release-keystore" "-PfsbKeystorePassword=$ANDROID_KEYSTORE_PASSWORD" "-PfsbKeyAlias=$ANDROID_KEY_ALIAS" "-PfsbKeyPassword=$ANDROID_KEY_PASSWORD")
            echo "Signing with the release key"
          else
            echo "::warning title=No release key::ANDROID_KEYSTORE_BASE64 isn't saved, so this build is signed with a debug key made for this run. It installs on a phone that doesn't have the app, not over the app, and Google Play won't take it."
          fi
          ./gradlew --no-daemon assembleRelease bundleRelease "${signing[@]}"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/family-site-blocker.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/family-site-blocker.aab"
          ls -l "$GITHUB_WORKSPACE/family-site-blocker.apk" "$GITHUB_WORKSPACE/family-site-blocker.aab"

      - name: Take the key off the machine
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore"

      - name: Keep the APK and the bundle
        uses: actions/upload-artifact@v7
        with:
          name: family-site-blocker-android
          path: |
            family-site-blocker.apk
            family-site-blocker.aab
          retention-days: 30
          if-no-files-found: error
