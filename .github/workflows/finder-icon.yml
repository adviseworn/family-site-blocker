# One-off check, on a temporary branch: open family-site-blocker-1.1.1.zip with Archive Utility, as double-clicking
# it in Finder does, and look at the .xpi that comes out in Finder. Results go to results/, committed back here.
name: Finder icon check
on: push
jobs:
  icon:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Open the zip with Archive Utility and look at the result in Finder
        run: |
          mkdir -p results ~/Downloads/check
          { sw_vers; uname -m; echo "zip sha256: $(shasum -a 256 family-site-blocker-1.1.1.zip | cut -d' ' -f1) (expected 7b52aba4022ae81d4cfec55ac56e8d926610b1240919feb7c5ec5684b71a68ee)"; } > results/report.txt
          cp family-site-blocker-1.1.1.zip ~/Downloads/check/
          cp signed.xpi ~/Downloads/check/"plain copy without the icon.xpi"
          open -a "Archive Utility" ~/Downloads/check/family-site-blocker-1.1.1.zip
          for i in $(seq 1 40); do [ -f ~/Downloads/check/family-site-blocker-1.1.1.xpi ] && break; sleep 1; done
          sleep 3
          cd ~/Downloads/check
          ls -la@ >> "$GITHUB_WORKSPACE/results/report.txt"
          sha=$(shasum -a 256 family-site-blocker-1.1.1.xpi | cut -d' ' -f1); same=no; [ "$sha" = "6732c1af58173bafd4e8c96dfb9b9d0acedfee4a541361e8eca6ff8cea93dee2" ] && same=yes
          echo "extracted .xpi is byte-identical to the signed file: $same" >> "$GITHUB_WORKSPACE/results/report.txt"
          open ~/Downloads/check
          sleep 6
          osascript -e 'tell application "Finder" to set current view of front window to icon view' -e 'tell application "Finder" to set icon size of icon view options of front window to 128' >/dev/null 2>&1 || true
          sleep 3
          screencapture -x "$GITHUB_WORKSPACE/results/screen.png"
      - name: Commit the results back to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results && git commit -q -m "Results" && git push -q origin HEAD:finder-icon-check
