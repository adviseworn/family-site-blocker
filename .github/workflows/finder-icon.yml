# One-off check, on a temporary branch. 1) Does family-site-blocker-1.1.1.zip (made on Linux) give the .xpi the
# gate icon when opened on a Mac? 2) The same with an icon set by macOS itself and zipped like Finder's Compress.
# Results are posted as annotations; the Mac-made zip is committed back to this branch.
name: Finder icon check
on: push
jobs:
  icon:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build the helpers
        run: |
          swiftc -O icon.swift -o icon-renderer
          swiftc -O seticon.swift -o seticon
      - name: Set the icon with macOS, and zip it the way Finder's Compress does
        run: |
          mkdir mac && cp signed.xpi mac/family-site-blocker-1.1.1.xpi
          echo "setIcon: $(./seticon icon_1024.png mac/family-site-blocker-1.1.1.xpi)"
          ditto -c -k --sequesterRsrc --keepParent mac/family-site-blocker-1.1.1.xpi family-site-blocker-1.1.1-mac.zip
          unzip -l family-site-blocker-1.1.1-mac.zip
      - name: Open both zips with ditto and with Archive Utility
        run: |
          for z in family-site-blocker-1.1.1 family-site-blocker-1.1.1-mac; do
            mkdir "ditto-$z" && ditto -x -k "$z.zip" "ditto-$z"
            mkdir "au-$z" && cp "$z.zip" "au-$z/" && open -a "Archive Utility" "au-$z/$z.zip"
          done
          sleep 8
          ls -la@ ditto-* au-*
      - name: Report
        if: always()
        run: |
          echo "::notice title=Machine::$(sw_vers -productName) $(sw_vers -productVersion) on $(uname -m)"
          report() { # label file
            sha=$(shasum -a 256 "$2" | cut -d' ' -f1); same=no; [ "$sha" = "6732c1af58173bafd4e8c96dfb9b9d0acedfee4a541361e8eca6ff8cea93dee2" ] && same=yes
            echo "::notice title=$1::same bytes as the signed file: $same; $(python3 inspect-fork.py "$2")"
            echo "::notice title=$1 icon::$(./icon-renderer "$2" 64)"
          }
          report "set by macOS" mac/family-site-blocker-1.1.1.xpi
          for z in family-site-blocker-1.1.1 family-site-blocker-1.1.1-mac; do
            for how in ditto au; do
              f="$how-$z/family-site-blocker-1.1.1.xpi"
              if [ -f "$f" ]; then report "$z via $how" "$f"; else echo "::error title=$z via $how::no .xpi came out"; fi
            done
          done
      - name: Commit the Mac-made zip back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results && cp family-site-blocker-1.1.1-mac.zip results/
          git add results && git commit -q -m "Mac-made zip" && git push -q origin HEAD:finder-icon-check
