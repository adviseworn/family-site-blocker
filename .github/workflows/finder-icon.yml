# One-off check, on a temporary branch: what icon does macOS give the .xpi (1) after Get Info-style icon setting
# (NSWorkspace.setIcon), (2) out of a zip made from that file by ditto (Finder's Compress), (3) out of
# family-site-blocker-1.1.1.zip made on Linux? Results are annotations; the Mac-made zip is committed back.
name: Finder icon check
on: push
jobs:
  icon:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build the helpers
        run: |
          swiftc -O icon.swift -o icon-renderer
          swiftc -O seticon.swift -o seticon
      - name: Set the icon with macOS, then zip the file the way Finder's Compress does
        run: |
          mkdir set && cp signed.xpi set/family-site-blocker-1.1.1.xpi
          echo "setIcon: $(./seticon icon_1024.png set/family-site-blocker-1.1.1.xpi)"
          cd set && ditto -c -k --sequesterRsrc --keepParent family-site-blocker-1.1.1.xpi ../family-site-blocker-1.1.1-mac.zip
          cd .. && unzip -l family-site-blocker-1.1.1-mac.zip
      - name: Open both zips with Archive Utility, as double-clicking them in Finder does
        run: |
          for z in family-site-blocker-1.1.1 family-site-blocker-1.1.1-mac; do
            mkdir "au-$z" && cp "$z.zip" "au-$z/" && open -a "Archive Utility" "au-$z/$z.zip"
          done
          sleep 8
          ls -la@ au-*
          cp signed.xpi plain.xpi
      - name: Report
        if: always()
        run: |
          echo "::notice title=Machine::$(sw_vers -productName) $(sw_vers -productVersion) on $(uname -m)"
          report() { # label file
            sha=$(shasum -a 256 "$2" | cut -d' ' -f1); same=no; [ "$sha" = "6732c1af58173bafd4e8c96dfb9b9d0acedfee4a541361e8eca6ff8cea93dee2" ] && same=yes
            info=$(xattr -px com.apple.FinderInfo "$2" 2>/dev/null | tr -d ' \n')
            fork=$(xattr -px com.apple.ResourceFork "$2" 2>/dev/null | tr -d ' \n' | shasum | cut -c1-12)
            echo "::notice title=$1::same bytes as the signed file: $same; Finder info ${info:-none}; resource fork digest $fork"
            for how in custom effective workspace; do echo "::notice title=$1 $how icon::$(./icon-renderer "$2" $how)"; done
          }
          report "A set by macOS" set/family-site-blocker-1.1.1.xpi
          report "B mac zip via Archive Utility" au-family-site-blocker-1.1.1-mac/family-site-blocker-1.1.1.xpi
          report "C linux zip via Archive Utility" au-family-site-blocker-1.1.1/family-site-blocker-1.1.1.xpi
          report "D no icon" plain.xpi
      - name: Commit the Mac-made zip back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results && cp family-site-blocker-1.1.1-mac.zip results/
          git add results && git commit -q -m "Mac-made zip" && git push -q origin HEAD:finder-icon-check
