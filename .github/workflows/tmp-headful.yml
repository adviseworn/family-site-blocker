# Temporary, for one branch: Open the page in a headful Firefox on GitHub's Mac.
name: Temporary headful check

on:
  push:
    branches:
      - claude/project-thread-p3ux29

jobs:
  headful:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: test -d /Applications/Firefox.app || brew install --cask firefox
      - run: /Applications/Firefox.app/Contents/MacOS/firefox --version
      - run: npm install
      - name: Headful flow under the lock, with a full record
        env:
          HEADFUL: '1'
          LOCK: '1'
        run: node test/tmp-open-page.mjs
      - name: Headful flow without the lock, with a full record
        if: always()
        env:
          HEADFUL: '1'
        run: node test/tmp-open-page.mjs
