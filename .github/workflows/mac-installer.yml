# Builds the installer package for the launch agent that closes Firefox's Option key on a GitHub-hosted Mac
# (scripts/mac-installer.mjs, which needs Apple's pkgbuild) and adds it to the release of a version, next to
# the signed add-on and the lock's profile, with a line about it in the release's notes.
# Start it from the Actions tab with "Run workflow", on the commit of the version (main, for the newest),
# giving the version or leaving it blank for the one in extension/manifest.json. It never runs on its own: a
# private repository's minutes on a Mac count ten times.
name: Mac files for a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version whose release gets the package (blank: the one in extension/manifest.json)'
        required: false
        default: ''

permissions:
  contents: write # to add the file to the release

jobs:
  mac-files:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the installer package
        id: build
        env:
          ASKED: ${{ inputs.version }}
        run: |
          version="$ASKED"
          [ -n "$version" ] || version=$(node -p "require('./extension/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm run mac-installer
          ls -la dist/mac

      - name: Add the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error title=No release::There is no release v$VERSION to add the package to. The sign job of Tests and release makes it."
            exit 1
          fi
          pkg=$(ls dist/mac/*.pkg)
          gh release upload "v$VERSION" "$pkg" --clobber
          gh release view "v$VERSION" --json body --jq .body > notes.md
          if ! grep -q "Option key" notes.md; then
            printf '\n- **Close Firefox'"'"'s Option key on a Mac (optional):** `%s`, an installer package for the launch agent (README: "Close the Option key, too"). Unsigned, so macOS asks once, under Privacy & Security, to open it anyway.\n' "$(basename "$pkg")" >> notes.md
            gh release edit "v$VERSION" --notes-file notes.md
          fi
          echo "::notice title=Package added::$(gh release view "v$VERSION" --json url --jq .url)"
