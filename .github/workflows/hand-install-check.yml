# A one-off check: the signed add-on installed by hand in Firefox (not temporarily, not under the lock), then
# the test case, on a Linux machine at GitHub with Mozilla's own Firefox. See test/hand-install.check.mjs.
name: Hand-install check

on:
  push:
    branches:
      - claude/firefox-hand-install-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Get Firefox from Mozilla
        run: |
          curl -fsSL --retry 3 -o firefox.tar "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          mkdir -p ~/firefox && tar -xf firefox.tar -C ~/firefox --strip-components=1
          ~/firefox/firefox --version

      - name: Install what Firefox needs to run here
        run: |
          npm install
          npx playwright install-deps firefox

      - name: Get the latest signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.11.2 --pattern 'family-site-blocker-*.xpi' --dir signed
          ls -l signed

      - name: Install the signed add-on by hand and open the test site
        env:
          FIREFOX: /home/runner/firefox/firefox
        run: SIGNED_XPI=$(ls signed/*.xpi) node test/hand-install.check.mjs
