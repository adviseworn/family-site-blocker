# Checks the picture filter against real pictures (#50), which the tests can't do because they never
# contact a real website: with the extension loaded in Chromium on a GitHub-hosted Mac, each picture in
# test/real-pictures.txt is judged by the real classifier exactly as a page's picture would be, and its
# scores and verdicts are printed against what the list expects. Extra addresses can be given when
# starting the run. Start it from the Actions tab with "Run workflow".
name: Real pictures check

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'More picture addresses to judge, separated by spaces (printed, not judged against anything)'
        required: false
        default: ''
  push:
    branches: [pictures] # so it can run from its own branch before it's on main

permissions:
  contents: read

jobs:
  pictures:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and its Chromium
        run: |
          npm install
          npx playwright install chromium

      - name: Judge the pictures with the extension in Chromium
        env:
          PICTURE_URLS: ${{ github.event.inputs.urls }}
        run: npm run check:pictures
