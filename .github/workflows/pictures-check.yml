# Checks the picture filter against real pictures, which the tests can't do because they never contact a real
# website: with the extension loaded in Chromium, each picture in test/real-pictures.txt is judged by the real
# classifier exactly as a page's picture would be, and its scores and verdicts are printed against what the
# list expects (npm run check:pictures). Extra addresses can be given when starting the run.
# Start it from the Actions tab with "Run workflow".
name: Real pictures check

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'More picture addresses to judge, separated by spaces (printed, not judged against anything)'
        required: false
        default: ''

permissions:
  contents: read

env:
  npm_config_fund: 'false'
  npm_config_audit: 'false'
  npm_config_update_notifier: 'false'

jobs:
  pictures-check:
    # Ubuntu 24.04 by name: Playwright 1.56.0 has no Chromium for Ubuntu 26.04, which ubuntu-latest has become.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and its Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Judge the pictures with the extension in Chromium
        env:
          PICTURE_URLS: ${{ inputs.urls }}
        run: npm run check:pictures
