# Finds where Plucky puts its Firefox settings on a Mac. On a GitHub-hosted Mac with Firefox installed, it
# runs .github/plucky/firefox-policy-places.sh (which prints every place Firefox reads its policies from, and
# what each holds), installs the Plucky package named in PKG below with the installer command, turns on
# Plucky's Firefox support the way docs.pluckeye.net/firefox says (pluck + okfirefox, then pluck repair), and
# runs the script again. Both outputs are kept as the run's "firefox-policy-places" artifact, with the diff
# between them, what the installer and pluck printed, and pictures of the screen if the install needed
# looking into; the diff is in the log too. Nothing is approved in the Mac's GUI, so Plucky's system
# extension stays off, but that isn't what this looks at.
#
# Plucky-1.17.59.pkg doesn't install on GitHub's Macs (October 2026; macOS 26 and 15, Apple silicon and
# Intel): on a Mac without Plucky, its bootstrap asks
# https://up.pluckeye.net/plucky/macosx/<arch>/latest/about.json, which answers 404 "not found" from
# anywhere, so it says "Failed to download" and leaves nothing behind. The same package upgrades a Mac that
# already has Plucky (1.16.13 to 1.17.59 took two minutes and worked), so the bootstrap takes another route
# then; a fresh Mac, which is what GitHub gives, can't. A package whose fresh install works, dropped into
# .github/plucky with PKG changed to match, is what to try next. Start the run from the Actions tab with
# "Run workflow", picking the Mac to run it on; it never runs on its own.
name: Plucky's Firefox policy places

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Which GitHub-hosted Mac
        type: choice
        default: macos-latest
        options: [macos-latest, macos-26-intel, macos-15, macos-15-intel]

permissions:
  contents: read

jobs:
  places:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 20
    env:
      PKG: .github/plucky/Plucky-1.16.13.pkg # Plucky-1.17.59.pkg is the one that fails on a fresh Mac
    steps:
      - uses: actions/checkout@v5

      - name: Make sure Firefox is installed
        run: test -d /Applications/Firefox.app || brew install --cask firefox

      - name: Policy places before Plucky
        shell: bash
        run: .github/plucky/firefox-policy-places.sh 2>&1 | tee before.txt

      # The package's only payload is /tmp/plucky.install, a bootstrap that fetches the current Plucky from
      # pluckeye.net; its postinstall runs that (with -q, since installer sets COMMAND_LINE_INSTALL) and exits
      # 0 whatever happened, so the proof of the install is the pluck command being there. What the scripts
      # printed is in /var/log/install.log. If the package leaves no pluck behind, the bootstrap is run again
      # by hand from the expanded package, in the runner's login session, as sudo: first as the postinstall
      # ran it (1.17.59's exits 1 at once with "1.17.59 BAD_CALL"), then with --no-gui (the only option named
      # inside it; 1.17.59's puts up a "Failed to download" box with Cancel and Retry and waits) for 30 s
      # under tcpdump, as shipped and then with the PLUCKEYE_NO_HTTPS setting the bootstrap also knows, so
      # that the names it looks up, the connections it makes and (without TLS) its requests and the replies
      # are in the log, and the box is in the artifact's pictures.
      - name: Install Plucky
        timeout-minutes: 10
        shell: bash
        run: |
          find_pluck() { command -v pluck || sudo find /usr/local /opt /Library /Applications /Users/Shared -maxdepth 5 -type f -name pluck -perm -100 2>/dev/null | head -1; }
          left_behind() {
            echo "== what Plucky left on the Mac"
            { for d in /Applications /Library/LaunchDaemons /Library/LaunchAgents /Library/PrivilegedHelperTools "/Library/Application Support" /usr/local /usr/local/bin /opt; do
                ls -la "$d" 2>/dev/null | grep -i pluck | sed "s|^|$d: |"
              done
              sudo launchctl list | grep -i pluck | sed 's/^/launchd: /'
              pkgutil --pkgs | grep -i -E 'pluck|^inner$' | sed 's/^/package receipt: /'
              echo "pluck command: $(find_pluck)"; } || true
          }
          # Runs the bootstrap with --no-gui for 30 s under tcpdump, then kills it. $1 names the try; the rest
          # are environment settings for it.
          try_bootstrap() {
            local name=$1; shift
            echo "== $name: running the bootstrap with --no-gui${1:+ and $*}"
            sudo tcpdump -i "$iface" -s 0 -w "$name.pcap" 'udp port 53 or tcp port 80 or tcp port 443' > /dev/null 2>&1 &
            sleep 2
            sudo env "$@" "$bootstrap" --no-gui > "$name.log" 2>&1 &
            sleep 30
            screencapture -x "$name.png" && echo "(picture saved as $name.png)"
            sudo pkill -f plucky.install || true; sleep 1
            sudo pkill -f "tcpdump -i $iface" || true; sleep 1
            echo "-- what the bootstrap printed"; cat "$name.log" || true
            echo "-- names looked up and connections made"
            sudo tcpdump -nn -r "$name.pcap" 2>/dev/null | grep -E 'A\? |AAAA\? |Flags \[S\]|Flags \[R|Flags \[F' | head -40 || true
            echo "-- plain-HTTP requests and replies"
            sudo tcpdump -nn -A -r "$name.pcap" 'tcp port 80' 2>/dev/null | grep -a -E '^(GET|POST|HEAD|Host:|HTTP/|Location:|User-Agent:)' | head -20 || true
            left_behind
          }
          {
            sudo installer -pkg "$PKG" -target / -verbose
            echo "== what the package's scripts logged (/var/log/install.log)"
            sudo grep -i -E 'plucky|preinstall|postinstall|package_script' /var/log/install.log | tail -40 || true
            left_behind
            if [ -z "$(find_pluck)" ]; then
              echo "== no pluck command: running the package's bootstrap by hand, as the postinstall did"
              pkgutil --expand-full "$PKG" expanded
              bootstrap=$PWD/expanded/inner.pkg/Payload/tmp/plucky.install
              sudo env COMMAND_LINE_INSTALL=1 PACKAGE_PATH="$PWD/$PKG" "$bootstrap" -q || echo "(exit status $?)"
              left_behind
            fi
            if [ -z "$(find_pluck)" ]; then
              iface=$(route -n get default | awk '/interface/ {print $2}')
              echo "== still none; the Mac's network interface is $iface"
              try_bootstrap https-as-shipped
              if [ -z "$(find_pluck)" ]; then try_bootstrap plain-http PLUCKEYE_NO_HTTPS=1; fi
            fi
          } 2>&1 | tee install.log

      # Each pluck command's output and exit status goes to the log; the step fails only if pluck is missing or
      # won't take okfirefox.
      - name: Turn on Firefox support
        id: pluck
        shell: bash
        run: |
          pluck=$(command -v pluck || sudo find /usr/local /opt /Library /Applications /Users/Shared -maxdepth 5 -type f -name pluck -perm -100 2>/dev/null | head -1)
          if [ -z "$pluck" ]; then
            echo "::error title=Plucky::no pluck command after the install; see install.log in the artifact"
            exit 1
          fi
          status=0
          try() { echo "== $*"; "$@" || echo "(exit status $?)"; }
          {
            echo "pluck is $pluck"
            try "$pluck" version
            try "$pluck" delay
            try "$pluck" features
            # Firefox support needs 1.17.54 or newer; an older Plucky is asked to update itself first.
            v=$("$pluck" version 2>/dev/null | head -1); IFS=. read -r a b c <<< "$v"
            if [ "${a:-0}" -lt 1 ] || { [ "${a:-0}" -eq 1 ] && { [ "${b:-0}" -lt 17 ] || { [ "${b:-0}" -eq 17 ] && [ "${c:-0}" -lt 54 ]; }; }; }; then
              echo "== $v is older than 1.17.54, which Firefox support needs: asking Plucky to update"
              try "$pluck" pupdate
              for i in $(seq 1 16); do sleep 15; if [ "$("$pluck" version 2>/dev/null | head -1)" != "$v" ]; then break; fi; done
              echo "== after $((i * 15)) s"
              try "$pluck" version
            fi
            echo "== $pluck + okfirefox"
            "$pluck" + okfirefox || { echo "(exit status $?)"; status=1; }
            try "$pluck" repair
            try "$pluck" features
            try "$pluck" future
            echo "== waiting 15 s for Plucky to act on the change"; sleep 15
          } > pluck.log 2>&1
          cat pluck.log
          echo "version=$("$pluck" version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"
          if [ "$status" != 0 ]; then echo "::error title=Plucky::pluck + okfirefox failed; see pluck.log in the artifact"; fi
          exit $status

      - name: Policy places after Plucky
        if: always()
        shell: bash
        run: .github/plucky/firefox-policy-places.sh 2>&1 | tee after.txt

      # The script's "###" header and footer carry the date, so they're left out of the diff.
      - name: Compare the two
        if: always()
        shell: bash
        env:
          PLUCKY: ${{ steps.pluck.outputs.version || 'not installed' }}
        run: |
          if diff -u <(grep -v '^### ' before.txt) <(grep -v '^### ' after.txt) > diff.txt; then
            echo "::warning title=Policy places::nothing changed between the two runs"
          else
            cat diff.txt
          fi
          echo "::notice title=Machine::$(sw_vers -productName) $(sw_vers -productVersion) on $(uname -m); $(/Applications/Firefox.app/Contents/MacOS/firefox --version); Plucky $PLUCKY"

      - name: Keep both outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-policy-places
          path: |
            before.txt
            after.txt
            diff.txt
            install.log
            pluck.log
            *.png
          if-no-files-found: error
