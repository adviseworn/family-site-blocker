# Signs the Firefox add-on with Mozilla (addons.mozilla.org, unlisted) and publishes the result as a GitHub
# release named after the version: the signed .xpi, and the zip that gives it the add-on's icon on a Mac
# (npm run package:signed). Start it from the Actions tab with "Run workflow". If Mozilla already has the
# version, it downloads that signed file instead of uploading again. Then it publishes the update files
# that let installed copies update themselves (.github/workflows/publish-updates.yml), when the deploy key
# for that is saved, and adds the Mac files to the release (.github/workflows/mac-installer.yml).
#
# It needs two repository secrets (Settings → Secrets and variables → Actions), the two parts of an API key
# from https://addons.mozilla.org/developers/addon/api/key/ : AMO_JWT_ISSUER (the "JWT issuer") and
# AMO_JWT_SECRET (the "JWT secret").
name: Sign with Mozilla

on:
  workflow_dispatch:

permissions:
  contents: write # to publish the release

concurrency:
  group: sign-with-mozilla

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.key.outputs.publish }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check that the API key is saved
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error title=No API key::Save AMO_JWT_ISSUER and AMO_JWT_SECRET under Settings → Secrets and variables → Actions. They come from https://addons.mozilla.org/developers/addon/api/key/"
            exit 1
          fi

      - name: Build the Firefox package
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run package:firefox
          version=$(node -p "require('./extension/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error title=Already released::Version $version is already signed and released. Raise version in extension/manifest.json first."
            exit 1
          fi

      - name: Get the file signed by Mozilla
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          # Mozilla won't take the same version twice. If it already has this one (uploaded by hand, or by a
          # run that stopped later on), download its signed file; otherwise upload and wait for the signature.
          found=0
          node scripts/amo-signed.mjs "$VERSION" web-ext-artifacts || found=$?
          if [ "$found" = 3 ]; then
            npx --yes web-ext@10.7.0 sign --channel=unlisted --source-dir=dist/firefox --artifacts-dir=web-ext-artifacts --approval-timeout=1500000
          elif [ "$found" != 0 ]; then
            exit "$found"
          fi

      - name: Check the signed file and make the Mac zip
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          signed=$(ls web-ext-artifacts/*.xpi)
          node scripts/check-signed.mjs "$signed" dist/firefox
          npm run package:signed -- "$signed"
          cp "$signed" "dist/family-site-blocker-$VERSION.xpi"
          echo "::notice title=Signed::$(node scripts/check-signed.mjs "$signed" dist/firefox | sed 's/^[^:]*: //'); sha256 $(sha256sum "$signed" | cut -c1-16)…"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Version $VERSION, signed by Mozilla for Firefox.

          - **On a Mac:** download \`family-site-blocker-$VERSION.zip\` and double-click it. You get \`family-site-blocker-$VERSION.xpi\` with the add-on's icon.
          - **Elsewhere:** download \`family-site-blocker-$VERSION.xpi\`.

          Then in Firefox, open \`about:addons\`, click the gear (⚙), choose **Install Add-on From File…** and pick the \`.xpi\`.
          EOF
          gh release create "v$VERSION" "dist/family-site-blocker-$VERSION.zip" "dist/family-site-blocker-$VERSION.xpi" \
            --target "$GITHUB_SHA" --title "Family Site Blocker $VERSION" --notes-file notes.md
          echo "::notice title=Released::$(gh release view "v$VERSION" --json url --jq .url)"

      # Secrets can't be read in a job's `if`, so this step turns the deploy key's presence into an output.
      - name: Can the update files be published?
        id: key
        env:
          UPDATES_DEPLOY_KEY: ${{ secrets.UPDATES_DEPLOY_KEY }}
        run: |
          if [ -n "$UPDATES_DEPLOY_KEY" ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Updates not published::Installed copies won't pick this version up by themselves until the update files are published. Save the UPDATES_DEPLOY_KEY secret (README: \"Let it update itself\") and run the Publish updates workflow."
          fi

  publish:
    needs: sign
    if: needs.sign.outputs.publish == 'yes'
    uses: ./.github/workflows/publish-updates.yml
    secrets: inherit

  # The Mac files (the lock's profile and the installer package that closes Firefox's Option key) are built
  # on a Mac and added to the release. GitHub's Macs are sometimes scarce; if this job can't get one, start
  # "Mac files for a release" by hand later.
  mac-files:
    needs: sign
    uses: ./.github/workflows/mac-installer.yml
    with:
      version: ${{ needs.sign.outputs.version }}
