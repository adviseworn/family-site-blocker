# Finishes the history rewrite of 2026-11-13, which replaced old commits by copies with the same files, the
# same dates and reworded messages. Every branch has been pushed again; this workflow does the two things
# that a push from outside cannot. It points each release tag at its rewritten commit, which has the same
# files as the commit the tag points at now, so every release keeps its tag, its page and its files. And it
# deletes the records of old runs that describe the replaced commits, with the four runs that started by
# themselves during the rewrite and were stopped.
#
# Start it from the Actions tab with "Run workflow", choosing this branch. With "yes" in the box it changes
# things; with anything else it only checks and says what it would do. Running it again is harmless: a tag
# already in place and a record already gone are skipped.
name: Move tags

on:
  workflow_dispatch:
    inputs:
      go:
        description: 'yes: move the tags and delete the run records. Anything else: only check.'
        required: false
        default: 'no'

permissions:
  contents: write # to move the tags
  actions: write # to delete run records

concurrency:
  group: move-tags

jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every branch and tag, so both ends of each move are at hand

      - name: Check each release tag and point it at its rewritten commit
        env:
          GO: ${{ inputs.go }}
        run: |
          set -euo pipefail
          git ls-remote --tags origin > remote-tags.txt
          leases=(); specs=(); failed=0; done_already=0
          while read -r tag old new; do
            [ -n "$tag" ] || continue
            now=$(awk -v r="refs/tags/$tag" '$2 == r { print $1 }' remote-tags.txt)
            if [ "$now" = "$new" ]; then
              echo "$tag is already at $new"
              done_already=$((done_already + 1))
              continue
            fi
            if [ "$now" != "$old" ]; then
              echo "::error::$tag is at ${now:-nothing}, not at $old as expected; left alone"
              failed=1
              continue
            fi
            if ! git cat-file -e "$new^{commit}" 2>/dev/null; then
              echo "::error::$tag: the rewritten commit $new is not in the repository"
              failed=1
              continue
            fi
            if [ "$(git rev-parse "$old^{tree}")" != "$(git rev-parse "$new^{tree}")" ]; then
              echo "::error::$tag: $new does not have the same files as $old"
              failed=1
              continue
            fi
            if [ -z "$(git branch -r --contains "$new" | head -1)" ]; then
              echo "::error::$tag: $new is not on any branch"
              failed=1
              continue
            fi
            echo "$tag: $old -> $new, same files"
            leases+=("--force-with-lease=refs/tags/$tag:$old")
            specs+=("$new:refs/tags/$tag")
          done <<'MAP'
