# Moves the release tags onto the rewritten commits of main (the history rewrite of 2026-10-31), which have
# the same content as the commits the tags point at now. Start it by hand from the Actions tab; it pushes with
# the workflow's own token, so it needs no git on a Mac. Running it again is harmless: a tag already in place
# is a no-op. Delete this file once the tags are moved.
name: Move tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Point each release tag at its rewritten commit
        run: |
          set -e
          git fetch origin main
          while read -r tag old new; do
            case "$tag" in '#'*|'') continue ;; esac
            git push --force origin "$new:refs/tags/$tag"
          done <<'MAP'
