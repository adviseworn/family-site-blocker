          v1.21.1 ef7263323cf054909773e957cb8ecf5186744ec1 75394590744b59ec9adac215b42e3d511906c181
          v1.22.0 4841644b357a7ebe4189f1aacc9b7863bf309c31 8d9fa40c8c76fd56c496f6553dbeed696e135e38
          v1.23.0 d485a3f7fc7854e19061139a595e926d58314b9d d4341cdccadb763c176511c68743e234ac4e2bb2
          MAP
          if [ "$failed" != 0 ]; then
            echo "Nothing was moved."
            exit 1
          fi
          echo "${#specs[@]} tags to move, $done_already already in place."
          if [ "${#specs[@]}" = 0 ]; then
            exit 0
          fi
          if [ "$GO" != yes ]; then
            echo "Only checking: nothing was moved."
            exit 0
          fi
          git push --atomic "${leases[@]}" origin "${specs[@]}"
          git ls-remote --tags origin > remote-tags-after.txt
          wrong=0
          for spec in "${specs[@]}"; do
            new=${spec%%:*}; ref=${spec#*:}
            now=$(awk -v r="$ref" '$2 == r { print $1 }' remote-tags-after.txt)
            [ "$now" = "$new" ] || { echo "::error::$ref is at $now after the push, not at $new"; wrong=1; }
          done
          [ "$wrong" = 0 ] && echo "Tags moved: ${#specs[@]}."
          exit "$wrong"

  runs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete the run records that describe the replaced commits
        env:
          GH_TOKEN: ${{ github.token }}
          GO: ${{ inputs.go }}
        run: |
          set -uo pipefail
          found=0; gone=0; deleted=0; failed=0
          while read -r id; do
            [ -n "$id" ] || continue
            if ! line=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[.status, .name, .head_sha[0:10]] | join(" ")' 2>/dev/null); then
              gone=$((gone + 1))
              continue
            fi
            found=$((found + 1))
            case "$line" in
              completed*) ;;
              *) echo "::error::run $id is not finished ($line); left alone"; failed=1; continue ;;
            esac
            if [ "$GO" != yes ]; then
              continue
            fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>err.txt; then
              deleted=$((deleted + 1))
            else
              echo "::error::run $id could not be deleted: $(cat err.txt)"
              failed=1
            fi
            sleep 2
