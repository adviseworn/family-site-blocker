# The Android browser's CI job, included from the root .gitlab-ci.yml (include: local: android/ci/android-job.yml).
#
# Gecko is big, so a build takes a good share of an hour of the free plan's 400 compute minutes a month, and the job
# never runs on its own, not even for an engine bump. It runs by hand:
#   - from any pipeline's page, the play button next to the android job (on main, say, once an add-on version has
#     landed and the phone should get it, since the add-on travels inside the app);
#   - in a pipeline started by hand (Build → Pipelines → New pipeline, or the pipelines API) with the variable
#     ANDROID set to yes, which then runs nothing else, like SIGN and PUBLISH.
# Its files: family-site-blocker.apk (arm64, the phone's chip) and family-site-blocker.aab (the Google Play bundle),
# kept for a month under the job's artifacts.
#
# The release key lives in CI/CD variables (Settings → CI/CD → Variables, masked and protected), entered there by the
# project's owner and nowhere else:
#   ANDROID_KEYSTORE           a file variable holding the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the job still builds, signed with a debug key: fine for installing by hand, not for Google Play.

android:
  stage: test
  needs: []
  image: eclipse-temurin:21-jdk
  timeout: 90 minutes
  interruptible: false
  variables:
    ANDROID_HOME: $CI_PROJECT_DIR/.android-sdk
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
    GRADLE_OPTS: -Dorg.gradle.daemon=false
  cache:
    key: android-sdk-and-gradle
    paths:
      - .android-sdk/
      - .gradle-home/caches/modules-2/
      - .gradle-home/wrapper/
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $ANDROID == "yes"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")
      when: never
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip > /dev/null
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
  script:
    - cd android
    - |
      SIGNING=""
      if [ -n "$ANDROID_KEYSTORE" ]; then
        SIGNING="-PfsbKeystore=$ANDROID_KEYSTORE -PfsbKeystorePassword=$ANDROID_KEYSTORE_PASSWORD -PfsbKeyAlias=$ANDROID_KEY_ALIAS -PfsbKeyPassword=$ANDROID_KEY_PASSWORD"
      fi
      ./gradlew --no-daemon assembleRelease bundleRelease $SIGNING
    - cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../family-site-blocker.apk
    - cp app/build/outputs/bundle/release/app-release.aab ../family-site-blocker.aab
    - ls -l ../family-site-blocker.apk ../family-site-blocker.aab
  artifacts:
    name: family-site-blocker-android
    paths:
      - family-site-blocker.apk
      - family-site-blocker.aab
    expire_in: 1 month
