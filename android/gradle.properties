org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# The app's own build number, the last two digits of versionCode (app/build.gradle). Raise it by one for every
# change to the app that goes to a phone without a new add-on version; it may go back to 0 when the add-on's
# version goes up. The first build to reach a phone (1.29.0, November 2026) counts as build 1.
fsbAppBuild=8
# uBlock Origin, the ad blocker built into the app (app/build.gradle, README.md under "Ad blocking"): the version, the
# address of its file on Mozilla's add-on site and the file's SHA-256. All three are one object at
# https://addons.mozilla.org/api/v5/addons/addon/ublock-origin/ (current_version: version, file.url, file.hash).
# The build stops if the file it gets has another checksum.
fsbUBlockOriginVersion=1.76.0
fsbUBlockOriginUrl=https://addons.mozilla.org/firefox/downloads/file/5225273/ublock_origin-1.76.0.xpi
fsbUBlockOriginSha256=6f20ff6749193599548770539103069c20948dfcd3e61c3089a67da7bfc3be39
