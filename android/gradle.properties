org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# The app's own build number, the last two digits of versionCode (app/build.gradle). Raise it by one for every
# change to the app that goes to a phone without a new add-on version; it may go back to 0 when the add-on's
# version goes up. The first build to reach a phone (1.29.0, November 2026) counts as build 1.
fsbAppBuild=5
