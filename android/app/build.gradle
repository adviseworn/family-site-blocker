import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    alias(libs.plugins.android.application)
}

// One version for the add-on and the app: the add-on's manifest.json is the source of truth.
// 1.23.0 becomes versionName "1.23.0" and versionCode 1023000.
def extensionDir = rootProject.file('../extension')
def extensionManifest = new JsonSlurper().parse(new File(extensionDir, 'manifest.json'))
def extensionVersion = extensionManifest.version as String
def versionParts = extensionVersion.tokenize('.').collect { it as int }
def computedVersionCode = versionParts[0] * 1_000_000 + versionParts[1] * 1_000 + versionParts[2]

// A release key comes from Gradle properties (CI variables). Without one, the debug key signs the APK,
// which still installs on a phone but cannot be uploaded to Google Play.
def releaseKeystore = providers.gradleProperty('fsbKeystore').orNull

android {
    namespace = 'io.gitlab.adviseworn.familysiteblocker'
    compileSdk { version = release(37) { minorApiLevel = 2 } }

    defaultConfig {
        applicationId = 'io.gitlab.adviseworn.familysiteblocker'
        minSdk = 26
        targetSdk = 37
        versionCode = computedVersionCode
        versionName = extensionVersion
    }

    signingConfigs {
        if (releaseKeystore != null) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = providers.gradleProperty('fsbKeystorePassword').get()
                keyAlias = providers.gradleProperty('fsbKeyAlias').get()
                keyPassword = providers.gradleProperty('fsbKeyPassword').get()
            }
        }
    }

    buildTypes {
        release {
            // R8 shrinks and renames the app's own code; GeckoView and Android Components keep what they
            // need through the rules in their own libraries. The engine's native libraries and omni.ja are
            // the bulk of the APK and are not touched. Resource shrinking stays off: it cannot be combined
            // with per-ABI APK splits and the app bundle in one build (AGP issue 402800800), and the code
            // shrink is where the saving is.
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = releaseKeystore != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    // One APK per processor type; the phone takes arm64-v8a. Google Play takes the bundle (bundleRelease) instead.
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    sourceSets {
        main {
            assets.srcDir(layout.buildDirectory.dir('generated/extension').get().asFile)
        }
    }
}

// The add-on goes into the APK's assets, from where GeckoView installs it as a built-in extension
// (resource://android/assets/extensions/family-site-blocker/). Same change as scripts/package-firefox.mjs:
// background.service_worker is for Chrome, Edge and Brave; Firefox runs background.scripts.
def copyExtension = tasks.register('copyExtension', Sync) {
    description = "Copies the add-on into the app's assets with Firefox's manifest."
    from(extensionDir) {
        exclude '_metadata/**', '**/.DS_Store'
    }
    into layout.buildDirectory.dir('generated/extension/extensions/family-site-blocker')
    doLast {
        def manifestFile = new File(destinationDir, 'manifest.json')
        def manifest = new JsonSlurper().parse(manifestFile)
        manifest.background?.remove('service_worker')
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n'
    }
}
tasks.named('preBuild') { dependsOn(copyExtension) }

// GeckoView (geckoview-omni) ships Glean's native code; the Glean library Android Components pull in
// ships it too. Pick GeckoView's copy, as Mozilla's Reference Browser does.
project.configurations.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability('org.mozilla.telemetry:glean-native') {
        def fromGeckoView = candidates.find { it.id instanceof ModuleComponentIdentifier && it.id.module.contains('geckoview') }
        if (fromGeckoView != null) {
            select(fromGeckoView)
        }
        because 'use the Glean inside GeckoView instead of the standalone one'
    }
}

