// The Android app lives next to the add-on in one repository: android/ is its own Gradle project.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
        // Mozilla's Android Components, GeckoView, Glean and the application-services bindings.
        maven {
            name = 'Mozilla'
            url = 'https://maven.mozilla.org/maven2'
            content { includeGroupByRegex 'org\\.mozilla.*' }
        }
    }
}

rootProject.name = 'family-site-blocker-android'
include ':app'
